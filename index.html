<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>寻亲风云录</title>
  <link rel="stylesheet" href="css/style.css?v=22">
</head>
<body>
  <div id="game-container">
    <!-- 顶部：玩家信息栏 -->
    <div id="player-info"></div>

    <div id="scene-container"></div>
    <div id="combat-container" style="display:none"></div>
    <div id="combat-log" style="display:none"></div>
    <div id="action-buttons" style="display:none"></div>
    <div id="combat-result" style="display:none"></div>
    <!-- 底部：管理栏 -->
    <div id="bottom-bar"></div>
  </div>

  <script src="systems/shop.js?v=22"></script>
  <script src="systems/dialogue.js?v=22"></script>
  <script src="systems/skills.js?v=22"></script>
  <script src="systems/gem.js?v=22"></script>
  <script src="systems/companions.js?v=22"></script>
  <script src="systems/elite.js?v=22"></script>
  <script src="systems/buff.js?v=22"></script>
  <script src="systems/quest.js?v=22"></script>
  <script src="systems/scene.js?v=22"></script>
  <script src="ui/renderer.js?v=22"></script>
  <script src="app.js?v=22"></script>

</html>
